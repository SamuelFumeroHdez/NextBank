name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Semanal: detecta vulnerabilidades descubiertas despues del ultimo commit.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nextbank_account
          POSTGRES_USER: nextbank
          POSTGRES_PASSWORD: nextbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      - name: Apply Flyway migrations
        run: |
          mvn -B -f account-service/pom.xml flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/nextbank_account \
            -Dflyway.user=nextbank \
            -Dflyway.password=nextbank \
            -Dflyway.locations=filesystem:account-service/src/main/resources/db/migration

      # Compilamos sin tests: CodeQL solo necesita el bytecode para analizar.
      - name: Build all services
        run: |
          for service in */; do
            if [ -f "$service/pom.xml" ]; then
              echo "Building $service"
              mvn -B -f "$service/pom.xml" compile -DskipTests
            fi
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
