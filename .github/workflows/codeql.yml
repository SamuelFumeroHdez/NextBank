name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Semanal: detecta vulnerabilidades descubiertas despues del ultimo commit.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      # Compilamos sin tests: CodeQL solo necesita el bytecode para analizar.
      - name: Build all services
        run: |
          for service in */; do
            if [ -f "$service/pom.xml" ]; then
              echo "Building $service"
              mvn -B -f "$service/pom.xml" compile -DskipTests
            fi
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
