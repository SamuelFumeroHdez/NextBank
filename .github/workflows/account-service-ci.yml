name: account-service CI

on:
  push:
    branches: [main]
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service-ci.yml'
  pull_request:
    paths:
      - 'account-service/**'
      - '.github/workflows/account-service-ci.yml'

# Si se empuja dos veces seguidas a la misma rama, cancela el build anterior
# en lugar de dejar dos corriendo en paralelo.
concurrency:
  group: account-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: account-service

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial completo para atribuir cada linea
          # a su commit; con un clone superficial pierde el "new code" analysis.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Los tests de integracion levantan PostgreSQL via Testcontainers.
      # Los runners de GitHub traen Docker preinstalado, asi que no hay que
      # configurar nada: Testcontainers lo detecta solo.
      - name: Build, test and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'account-service/target/surefire-reports/TEST-*.xml'
          check_name: 'account-service tests'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-service-coverage
          path: account-service/target/site/jacoco/
          retention-days: 7

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on dependencies
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: 'account-service'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # No fallamos el build por vulnerabilidades: se reportan en la
          # pestana Security. Endurecer esto (exit-code 1) cuando el
          # proyecto este estable y sepamos que el ruido es manejable.
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-account-service'
