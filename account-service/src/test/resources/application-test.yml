spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: localhost:9092

nextbank:
  outbox:
    poll-interval-ms: 999999

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN